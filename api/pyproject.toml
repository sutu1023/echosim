[project]
name = "echosim-api"
version = "0.0.1"
description = "EchoSim M0 runtime baseline"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["normal: normal path", "failure: failure path", "boundary: boundary path"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
known-local-folder = ["conftest"]
