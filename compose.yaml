name: echosim-fiction
x-runtime: &runtime
  build: .
  environment: &environment
    APP_ENV: ${APP_ENV:?Set APP_ENV}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:${PORT}}
    DEV_QUICK_LOGIN_ENABLED: ${DEV_QUICK_LOGIN_ENABLED:-false}
    MODEL_CONNECTION_TEST_ENABLED: ${MODEL_CONNECTION_TEST_ENABLED:-false}
    APP_VERSION: ${APP_VERSION:?Set APP_VERSION}
    PORT: ${PORT:?Set PORT}
    HEALTH_TIMEOUT_SECONDS: ${HEALTH_TIMEOUT_SECONDS:?Set HEALTH_TIMEOUT_SECONDS}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:?Set WORKER_POLL_SECONDS}
    DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  depends_on:
    db:
      condition: service_healthy
  stop_grace_period: 15s
  init: true
services:
  api:
    <<: *runtime
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health',timeout=12)"]
      interval: 5s
      timeout: 13s
      retries: 12
  migrate:
    <<: *runtime
    command: ["python", "-m", "echosim.manage", "migrate"]
  worker:
    <<: *runtime
    command: ["python", "-m", "echosim.worker"]
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  database:
