name: verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "覆盖期望 SHA（受控失败演练用；留空则使用触发 SHA）"
        required: false
        default: ""

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run acceptance (same command as local)
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: make verify

      - name: Assert report SHA and result
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_path = pathlib.Path("runtime/verify/last-run.json")
          if not report_path.is_file():
              sys.exit("缺少验收报告: %s" % report_path)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_SHA"]
          tested = report.get("tested_sha")
          result = report.get("result")

          print(f"expected_sha={expected}")
          print(f"tested_sha={tested}")
          print(f"result={result}")
          print(f"dirty={report.get('dirty')}")

          if tested != expected:
              sys.exit("报告 SHA 与触发 SHA 不一致")
          if result != "passed":
              sys.exit("验收结果不是 passed")
          if report.get("dirty") is not False:
              sys.exit("验收报告标记为脏工作树，不能作为干净检出证据")
          graph = report.get("graph_evidence") or {}
          calls = graph.get("calls") or {}
          if calls.get("real") != 0:
              sys.exit("默认验收出现建图真实外呼")
          PY

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ github.sha }}
          path: runtime/verify/
          if-no-files-found: error
          retention-days: 30

      - name: Stop environment
        if: always()
        run: make down || true

  verify-change-07:
    name: verify-change-07
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Change 07 offline acceptance
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: make verify CHANGE=2026-11-22-build-evidence-graph

      - name: Assert Change 07 report
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_path = pathlib.Path("runtime/verify/last-run.json")
          if not report_path.is_file():
              sys.exit("缺少 Change 07 验收报告: %s" % report_path)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_SHA"]
          tested = report.get("tested_sha")
          result = report.get("result")
          graph = report.get("graph_evidence") or {}
          calls = graph.get("calls") or {}

          print(f"expected_sha={expected}")
          print(f"tested_sha={tested}")
          print(f"result={result}")
          print(f"dirty={report.get('dirty')}")
          print(f"change={report.get('change')}")
          print(f"graph_mode={graph.get('mode')}")
          print(f"calls_real={calls.get('real')}")
          print(f"calls_double={calls.get('double')}")

          if tested != expected:
              sys.exit("报告 SHA 与触发 SHA 不一致")
          if result != "passed":
              sys.exit("Change 07 验收结果不是 passed")
          if report.get("dirty") is not False:
              sys.exit("Change 07 报告标记为脏工作树")
          if report.get("change") != "2026-11-22-build-evidence-graph":
              sys.exit("Change 07 报告 change 字段不一致")
          if graph.get("mode") != "offline-stub":
              sys.exit("Change 07 报告不是 offline-stub")
          if calls.get("real") != 0:
              sys.exit("Change 07 离线检查出现真实调用")
          if int(calls.get("double") or 0) <= 0:
              sys.exit("Change 07 未记录任何替身调用")
          if not (graph.get("workerRestored") or {}).get("modelProvider"):
              sys.exit("Change 07 结束后 worker provider 未恢复")
          PY

      - name: Upload Change 07 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-change-07-${{ github.sha }}
          path: runtime/verify/
          if-no-files-found: error
          retention-days: 30

      - name: Stop environment
        if: always()
        run: make down || true

  verify-change-06:
    name: verify-change-06
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Change 06 offline acceptance
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: make verify CHANGE=2026-11-21-connect-engine-providers

      - name: Assert Change 06 report
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_path = pathlib.Path("runtime/verify/last-run.json")
          if not report_path.is_file():
              sys.exit("缺少 Change 06 验收报告: %s" % report_path)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_SHA"]
          tested = report.get("tested_sha")
          result = report.get("result")
          engine = report.get("engine_evidence") or {}
          calls = engine.get("calls") or {}

          print(f"expected_sha={expected}")
          print(f"tested_sha={tested}")
          print(f"result={result}")
          print(f"dirty={report.get('dirty')}")
          print(f"change={report.get('change')}")
          print(f"engine_mode={engine.get('mode')}")
          print(f"calls_real={calls.get('real')}")

          if tested != expected:
              sys.exit("报告 SHA 与触发 SHA 不一致")
          if result != "passed":
              sys.exit("Change 06 验收结果不是 passed")
          if report.get("dirty") is not False:
              sys.exit("Change 06 报告标记为脏工作树")
          if report.get("change") != "2026-11-21-connect-engine-providers":
              sys.exit("Change 06 报告 change 字段不一致")
          if engine.get("mode") != "offline-contract":
              sys.exit("Change 06 报告不是 offline-contract")
          if calls.get("real") != 0:
              sys.exit("Change 06 离线检查出现真实调用")
          PY

      - name: Upload Change 06 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-change-06-${{ github.sha }}
          path: runtime/verify/
          if-no-files-found: error
          retention-days: 30

      - name: Stop environment
        if: always()
        run: make down || true
