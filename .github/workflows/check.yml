name: Runtime checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: npm install -g @fission-ai/openspec@1.14.3
      - run: make setup
      - run: make check
      - run: make audit
      - run: make smoke
